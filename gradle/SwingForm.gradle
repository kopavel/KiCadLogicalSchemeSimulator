import java.nio.file.Files
import java.nio.file.StandardCopyOption

configurations {
    formsClasspath {
        extendsFrom implementation
    }
}
dependencies {
    formsClasspath libs.idea.gui.compiller
}
File instrumentedClassesDir = project.layout.buildDirectory.dir("swing-classes/main").get().asFile
SourceSetContainer sourceSets = project.extensions.getByType(JavaPluginExtension).sourceSets
List<Map<String, File>> instrumentedTuples = []
sourceSets.each { ss ->
    def outDir = ss.java.destinationDirectory.get().asFile
    ss.allSource.srcDirs.each { srcDir ->
        fileTree(srcDir).matching { include '**/*.form' }.files.each { formFile ->
            def relativePath = formFile.path - srcDir.path - File.separator
            String classRelativePath = relativePath.replaceFirst(/\.form$/, '.class') as String
            instrumentedTuples << [form: formFile, source: new File(outDir, classRelativePath), destination: new File(instrumentedClassesDir, classRelativePath)]
        }
    }
}
def instrumentForms = tasks.register("instrumentForms") {
    def projectRoot = project.projectDir.toPath()
    inputs.files(project.provider { instrumentedTuples.collect { [it.source, it.form] }.flatten() })
    outputs.files(project.provider { instrumentedTuples.collect { it.destination }.flatten() })
    doFirst {
        def missing = instrumentedTuples.findAll { !it.source.exists() }
        if (!missing.isEmpty()) {
            def lines = missing.collect { tuple ->
                "/" + projectRoot.relativize(tuple.form.toPath()).toString().replace('\\', '/')
            }.join("\n")
            throw new GradleException("Swing forms do not have associated compiled classes:\n${lines}\nDid you compile the project?")
        }
    }
    def javaSrcDirs = sourceSets.main.java.sourceDirectories.files
    def cPath = configurations.formsClasspath.asPath
    doLast {
        ant.echo(message: "Patching GUI Designer form binding .class files")
        ant.taskdef(
                name: "javac2",
                classname: "com.intellij.ant.InstrumentIdeaExtensions",
                classpath: cPath
        )
        instrumentedTuples.each { tuple ->
            tuple.destination.createParentDirectories()
            ant.echo(message: "instrument: $tuple.source")
            Files.copy(tuple.source.toPath(), tuple.destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
        javaSrcDirs.forEach { javaSrcDir ->
            ant.javac2(
                    includeantruntime: false,
                    srcdir: javaSrcDir.path,
                    destdir: instrumentedClassesDir.path,
                    classpath: cPath,
                    failOnError: true
            )
        }
    }
    dependsOn classes
}

tasks.named("jar") {
    def replacedClassPaths = instrumentedTuples.collect { it.source.path }.toSet() as Set<String>
    eachFile { f ->
        if (replacedClassPaths.contains(f.file.path)) {
            f.exclude()
        }
    }
    from(instrumentedClassesDir)
    dependsOn instrumentForms
}
